name: checks
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17-alpine
        env:
          {
            POSTGRES_DB: gateway_test,
            POSTGRES_USER: gateway,
            POSTGRES_PASSWORD: localdev,
          }
        ports: ["5432:5432"]
        options: --health-cmd="pg_isready -U gateway -d gateway_test" --health-interval=5s --health-retries=10
    env:
      DATABASE_URL: postgres://gateway:localdev@localhost:5432/gateway_test
      TEST_DATABASE_URL: postgres://gateway:localdev@localhost:5432/gateway_test
      APP_ENV: test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 24 }
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:migrate
      - run: pnpm lint
      - run: pnpm --filter @zekivo/web exec next typegen
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:checkout
      - name: Staging Devnet playground (mock API, no funds)
        run: pnpm exec playwright test --grep @staging
        env:
          STAGING_PLAYGROUND_E2E: "1"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: checkout-browser-results
          path: |
            test-results/ui
            playwright-report
          retention-days: 7
