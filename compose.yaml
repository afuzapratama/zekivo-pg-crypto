name: zekivo-gateway-local
services:
  validator:
    image: zekivo-local-validator:4.3.2
    build:
      context: infra/docker
      dockerfile: validator.Dockerfile
    platform: linux/amd64
    # Agave 4 uses io_uring, blocked by Docker default seccomp. Local validator only.
    security_opt: ["seccomp=unconfined", "no-new-privileges:true"]
    cap_drop: [ALL]
    ports: ["127.0.0.1:${SOLANA_RPC_PORT:-8899}:8899"]
    volumes: ["solana-ledger:/ledger"]
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'curl -sf -H ''Content-Type: application/json'' -d ''{"jsonrpc":"2.0","id":1,"method":"getHealth"}'' http://127.0.0.1:8899 | grep -q ''"ok"''',
        ]
      interval: 3s
      timeout: 3s
      retries: 60
      start_period: 15s
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: gateway
      POSTGRES_USER: gateway
      POSTGRES_PASSWORD: localdev
    ports: ["127.0.0.1:${POSTGRES_PORT:-55432}:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gateway -d gateway"]
      interval: 2s
      timeout: 3s
      retries: 30
  migrate:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile
      target: base
    environment: &env
      APP_ENV: local
      SOLANA_CLUSTER: localnet
      SOLANA_RPC_URL: http://validator:8899
      CHAIN_MONITORING: "true"
      DATABASE_URL: postgres://gateway:localdev@postgres:5432/gateway
      HOST: 0.0.0.0
      PORT: 4100
      WEB_ORIGIN: http://localhost:3100
      NOTIFICATION_ENCRYPTION_KEY: "abcdef0123456789abcdef0123456789abcdef0123456789abcdef0123456789"
      WEBHOOK_DELIVERY: "true"
      WEBHOOK_ENCRYPTION_KEY: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
      LOCAL_WEBHOOK_URL: http://webhook-receiver:4200/webhooks/zekivo
      LOCAL_WEBHOOK_SECRET: whsec_local_development_only
      LOCAL_RECEIVER_CONTROL_TOKEN: local_receiver_control_only
    command: ["pnpm", "db:migrate"]
    depends_on:
      postgres: { condition: service_healthy }
  seed:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile
      target: base
    environment: *env
    command: ["pnpm", "db:seed"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      webhook-receiver: { condition: service_started }
  chain-seed:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile
      target: base
    environment: *env
    command: ["pnpm", "local:seed-chain"]
    depends_on:
      validator: { condition: service_healthy }
      seed: { condition: service_completed_successfully }
  webhook-receiver:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile
      target: base
    environment: *env
    command: ["pnpm", "--filter", "@zekivo/webhook-receiver", "dev"]
    ports: ["127.0.0.1:${RECEIVER_PORT:-4200}:4200"]
    depends_on:
      migrate: { condition: service_completed_successfully }
  api:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile
      target: base
    environment:
      <<: *env
      ADMIN_AUTH_ENABLED: ${ADMIN_AUTH_ENABLED:-false}
      ENTRA_TENANT_ID: ${ENTRA_TENANT_ID:-}
      ENTRA_CLIENT_ID: ${ENTRA_CLIENT_ID:-}
      ENTRA_CLIENT_SECRET: ${ENTRA_CLIENT_SECRET:-}
      ADMIN_ALLOWED_IDENTITIES: ${ADMIN_ALLOWED_IDENTITIES:-}
    command: ["pnpm", "--filter", "@zekivo/api", "dev"]
    ports: ["127.0.0.1:${API_PORT:-4100}:4100"]
    depends_on:
      chain-seed: { condition: service_completed_successfully }
  worker:
    extra_hosts: ["host.docker.internal:host-gateway"]
    stop_grace_period: 60s
    build:
      context: .
      dockerfile: infra/docker/Dockerfile
      target: base
    environment: *env
    command: ["pnpm", "--filter", "@zekivo/worker", "dev"]
    depends_on:
      chain-seed: { condition: service_completed_successfully }
  monitor:
    build: { context: ., dockerfile: infra/docker/Dockerfile, target: base }
    restart: unless-stopped
    extra_hosts: ["host.docker.internal:host-gateway"]
    environment:
      APP_ENV: local
      SOLANA_CLUSTER: localnet
      SOLANA_RPC_URL: http://validator:8899
      ENABLED_ASSETS: USDT,USDC
      CHAIN_MONITORING: "true"
      DATABASE_URL: postgres://gateway:localdev@postgres:5432/gateway
      NOTIFICATION_ENCRYPTION_KEY: "abcdef0123456789abcdef0123456789abcdef0123456789abcdef0123456789"
      MONITOR_API_URL: http://api:4100
    command: ["pnpm", "exec", "tsx", "packages/monitoring/src/main.ts"]
    stop_grace_period: 60s
    depends_on:
      {
        api: { condition: service_started },
        worker: { condition: service_started },
      }
  local-tools:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile
      target: base
    environment:
      <<: *env
      LOCAL_PLAYGROUND_TOKEN: local_playground_control_only
      LOCAL_GATEWAY_URL: http://api:4100
    command: ["pnpm", "local:playground"]
    stop_grace_period: 130s
    depends_on:
      chain-seed: { condition: service_completed_successfully }
      api: { condition: service_started }
  web:
    environment:
      API_INTERNAL_URL: http://api:4100
      APP_ENV: local
      WEB_ORIGIN: http://localhost:${WEB_PORT:-3100}
      SOLANA_CLUSTER: localnet
      LOCAL_PLAYGROUND: "true"
      LOCAL_PLAYGROUND_URL: http://local-tools:4300
      LOCAL_PLAYGROUND_TOKEN: local_playground_control_only
    build:
      context: .
      dockerfile: infra/docker/Dockerfile
      target: base
    command: ["pnpm", "--filter", "@zekivo/web", "dev"]
    ports: ["127.0.0.1:${WEB_PORT:-3100}:3100"]
volumes:
  postgres-data:
  solana-ledger:
